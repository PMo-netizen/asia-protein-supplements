name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode indicative pack JPEGs
        run: |
          set -euo pipefail
          mkdir -p public/images
          shopt -s nullglob
          for f in public/images/*.jpg.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded ${out} $(wc -c < "$out") bytes"
            rm -f "$f"
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
