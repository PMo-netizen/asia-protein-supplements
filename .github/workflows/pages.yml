name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode indicative pack JPEGs
        run: |
          set -euo pipefail
          mkdir -p public/images
          shopt -s nullglob
          for stem in pack-tin pack-range use-pour shelf-tins; do
            whole="public/images/${stem}.jpg.b64"
            parts=( public/images/${stem}.jpg.b64.part* )
            if [[ -f "$whole" ]]; then
              base64 -d "$whole" > "public/images/${stem}.jpg"
              echo "decoded ${stem} $(wc -c < public/images/${stem}.jpg) bytes"
              rm -f "$whole"
            elif ((${#parts[@]})); then
              cat "${parts[@]}" | base64 -d > "public/images/${stem}.jpg"
              echo "decoded ${stem} $(wc -c < public/images/${stem}.jpg) bytes"
              rm -f "${parts[@]}"
            fi
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
