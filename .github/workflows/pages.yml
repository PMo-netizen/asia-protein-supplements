name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode indicative pack JPEGs
        run: |
          set -uo pipefail
          mkdir -p public/images
          shopt -s nullglob
          for stem in pack-tin pack-range use-pour shelf-tins; do
            whole="public/images/${stem}.jpg.b64"
            parts=( public/images/${stem}.jpg.b64.part* )
            out="public/images/${stem}.jpg"
            if [[ -f "$whole" ]]; then
              if base64 -d "$whole" > "$out" 2>/dev/null; then
                echo "decoded ${stem} $(wc -c < "$out") bytes"
                rm -f "$whole"
              else
                echo "skip incomplete ${stem} whole"
                rm -f "$out"
              fi
            elif ((${#parts[@]})); then
              if cat "${parts[@]}" | base64 -d > "$out" 2>/dev/null; then
                echo "decoded ${stem} $(wc -c < "$out") bytes"
                rm -f "${parts[@]}"
              else
                echo "skip incomplete ${stem} parts (${#parts[@]})"
                rm -f "$out"
              fi
            fi
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
