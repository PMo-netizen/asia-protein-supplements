name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode indicative pack JPEGs
        run: |
          set -uo pipefail
          mkdir -p public/images
          shopt -s nullglob
          decode() {
            local stem="$1"
            local out="public/images/${stem}.jpg"
            local whole="public/images/${stem}.jpg.b64"
            local parts=( public/images/${stem}.jpg.b64.part* )
            local src
            if [[ -f "$whole" ]]; then
              src="$whole"
            elif ((${#parts[@]})); then
              src="${parts[*]}"
            else
              return 0
            fi
            if cat $src | tr -d '\n\r \t' | base64 -d > "$out" 2>/dev/null && [[ -s "$out" ]]; then
              echo "decoded ${stem} $(wc -c < "$out") bytes"
              rm -f $src
            else
              echo "skip incomplete ${stem}"
              rm -f "$out"
            fi
          }
          decode pack-tin
          decode pack-range
          decode use-pour
          decode shelf-tins
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
